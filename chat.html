<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Kampl'a Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: white;
    }

    header {
      background: #102b50;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
    }

    #back {
      color: white;
      background: #24466f;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
    }

    #personName {
      margin: 0;
      font-size: 18px;
    }

    #personUsername {
      color: #a9bfd9;
      font-size: 12px;
      margin-top: 4px;
    }

    #messages {
      padding: 18px;
      height: calc(100dvh - 150px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 15px;
      overflow-wrap: anywhere;
    }

    .sent {
      align-self: flex-end;
      background: #1769aa;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #142d4b;
      border-bottom-left-radius: 4px;
    }

    .time {
      display: block;
      font-size: 10px;
      color: #c6d8eb;
      margin-top: 6px;
      text-align: right;
    }

    #empty {
      color: #a9bfd9;
      text-align: center;
      margin-top: 35px;
    }

    #composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #10233d;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #315477;
      border-radius: 25px;
      background: #071426;
      color: white;
      outline: none;
    }

    #sendButton {
      background: #1769aa;
      border: 0;
      color: white;
      padding: 0 19px;
      border-radius: 25px;
      font-weight: bold;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      padding: 10px 16px;
      color: #a9bfd9;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <button id="back">←</button>

  <div>
    <h2 id="personName">Loading...</h2>
    <div id="personUsername"></div>
  </div>
</header>

<div id="status">Connecting...</div>

<main id="messages">
  <p id="empty">Loading messages...</p>
</main>

<form id="composer">
  <input
    id="messageInput"
    type="text"
    placeholder="Write a message..."
    maxlength="4000"
    autocomplete="off"
    required
  >

  <button id="sendButton" type="submit">Send</button>
</form>

<script type="module" src="js/chat.js"></script>

</body>
  </html>
