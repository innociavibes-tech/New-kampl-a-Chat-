<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampl'a Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <div class="logo">K</div>

        <h1>Kampl'a Chat</h1>

        <p class="tagline">Connect. Chat. Share.</p>

        <div class="chat-preview">
            <div class="bubble received">
                Hello! How are you?
            </div>

            <div class="bubble sent">
                I'm doing great!
            </div>

            <div class="bubble received">
                Welcome to Kampl'a Chat.
            </div>
        </div>

        <a href="register.html" class="button primary">
            Create Account
        </a>

        <a href="login.html" class="button secondary">
            Login
        </a>

        <p class="footer">Private. Fast. Connected.</p>

    </main>

</body>
</html>
